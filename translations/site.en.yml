about:
  title: Ultimate Warfare - About
  header: About Ultimate Warfare
  intro: Ultimate Warfare is a free strategy war game in your browser. Lead a nation and fight for control of the world.
  game:
    heading: What the game is about
    long_game:
      title: A war that lasts weeks.
      text: Each world runs for weeks or even months, and the game keeps going while you're offline. Buildings finish, your population grows and armies march on, even when you're not watching. Think ahead and make sure your nation can hold its own until you're back.
    economy:
      title: Build an economy.
      text: A strong army starts with a strong economy. Farms, mines and woodcutters produce the food, steel and wood you need, while houses give your people a place to live. A growing population brings in more money and provides the soldiers, pilots and sailors that crew your army.
    military:
      title: Fight on land, at sea and in the air.
      text: Start out with simple infantry and use research to unlock ever stronger units, from tanks and submarines to bombers and missiles. March your troops over land, sail your fleets across the sea and send your aircraft wherever they're needed to conquer new regions.
    diplomacy:
      title: Ally, trade and spy.
      text: You don't have to fight alone. Join a federation to team up with other players, buy and sell resources on the market, and use covert operations to spy on your enemies or sabotage their plans.
    guide: New here? Read the %linkStart%game guide%linkEnd%.
  support:
    heading: Support Ultimate Warfare
    paragraph_1: Ultimate Warfare is a hobby project by Frank Schreuder (%linkStart%FrankProjects%linkEnd%). The game has been online since 2006, and new features and improvements are still being added today.
    paragraph_2: The game is open source, so anyone can see how it works. You can find the source code on %linkStart%GitHub%linkEnd%. Whether you want to fix a bug, suggest an idea or build a new feature, your contributions are very welcome.
    paragraph_3: Ultimate Warfare is, and always will be, free to play. If you enjoy the game and would like to support it, you can make a donation through PayPal. Every donation helps to pay for hosting and keeps development going.
    donate_alt: Donate
contact_page:
  title: Ultimate Warfare - Contact
  header: Contact
  intro: Your feedback helps us improve Ultimate Warfare. Whether you have a suggestion, a question, or want to report an issue, we'd love to hear from you.
