about:
  title: Ultimate Warfare - Over
  header: Over Ultimate Warfare
  intro: Ultimate Warfare is een gratis strategisch oorlogsspel in je browser. Leid een natie en strijd om de macht over de wereld.
  game:
    heading: Waar het spel om draait
    long_game:
      title: Een oorlog die weken duurt.
      text: Elke wereld loopt weken of zelfs maanden, en het spel gaat gewoon door terwijl je offline bent. Gebouwen worden afgerond, je bevolking groeit en legers trekken verder, ook als je niet kijkt. Denk dus vooruit en zorg dat je natie zich staande houdt tot je terug bent.
    economy:
      title: Bouw een economie op.
      text: Een sterk leger begint met een sterke economie. Boerderijen, mijnen en houthakkers leveren het voedsel, staal en hout dat je nodig hebt, en in huizen woont je bevolking. Een groeiende bevolking brengt meer geld op en levert de soldaten, piloten en matrozen die je leger bemannen.
    military:
      title: Vecht op land, op zee en in de lucht.
      text: Je begint met eenvoudige infanterie en ontgrendelt via onderzoek steeds sterkere eenheden, van tanks en onderzeeërs tot bommenwerpers en raketten. Laat je troepen over land marcheren, stuur je vloot over zee en zet je vliegtuigen in waar ze nodig zijn om nieuwe gebieden te veroveren.
    diplomacy:
      title: Sluit allianties, handel en spioneer.
      text: Je hoeft niet alleen te vechten. Word lid van een federatie om samen te werken met andere spelers, koop en verkoop grondstoffen op de markt, en gebruik geheime operaties om je vijanden te bespioneren of hun plannen te saboteren.
    guide: Nieuw hier? Lees de %linkStart%spelgids%linkEnd%.
  support:
    heading: Steun Ultimate Warfare
    paragraph_1: Ultimate Warfare is een hobbyproject van Frank Schreuder (%linkStart%FrankProjects%linkEnd%). Het spel is sinds 2006 online en wordt nog altijd verder ontwikkeld met nieuwe functies en verbeteringen.
    paragraph_2: Het spel is open source, dus iedereen kan zien hoe het werkt. Je vindt de broncode op %linkStart%GitHub%linkEnd%. Of je nu een bug wilt oplossen, een idee wilt voorstellen of een nieuwe functie wilt bouwen, je bijdrage is van harte welkom.
    paragraph_3: Ultimate Warfare is en blijft gratis te spelen. Vind je het spel leuk en wil je het steunen, dan kun je een donatie doen via PayPal. Elke donatie helpt om de hosting te betalen en de ontwikkeling door te laten gaan.
    donate_alt: Doneren
contact_page:
  title: Ultimate Warfare - Contact
  header: Contact
  intro: Jouw feedback helpt ons Ultimate Warfare te verbeteren. Of je nu een suggestie, een vraag of een probleemmelding hebt, we horen graag van je.
